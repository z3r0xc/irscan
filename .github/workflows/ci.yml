name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ir-recon
    steps:
      - uses: actions/checkout@v4

      # A ref that does not contain the crate yet (for example the repository
      # bootstrap commit) is a valid repository state, not a failure. Skipping the
      # Rust checks there keeps a green tick meaningful instead of teaching everyone
      # to ignore a red one.
      - name: Does this ref contain the crate?
        id: crate
        shell: bash
        working-directory: .
        run: |
          if [ -f ir-recon/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ir-recon/ is absent on this ref, so the Rust checks are skipped."
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.crate.outputs.present == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.crate.outputs.present == 'true'
        with:
          workspaces: ir-recon

      - name: Formatting
        if: steps.crate.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: Lints (deny warnings)
        if: steps.crate.outputs.present == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        if: steps.crate.outputs.present == 'true'
        run: cargo test

      - name: Release build
        if: steps.crate.outputs.present == 'true'
        run: cargo build --release

      - name: Signature database generation is deterministic
        if: steps.crate.outputs.present == 'true'
        shell: bash
        working-directory: .
        run: sh tools/check_generated.sh
