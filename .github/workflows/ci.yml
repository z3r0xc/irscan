name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ir-recon
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ir-recon

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Release build
        run: cargo build --release

      - name: Signature database generation is deterministic
        working-directory: .
        shell: bash
        run: sh tools/check_generated.sh
