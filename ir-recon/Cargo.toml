[package]
name = "irscan"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Read-only Windows endpoint triage for unauthorised remote-control / employee-monitoring agents"
license = "MIT OR Apache-2.0"
build = "build.rs"

# edition 2021 is deliberate: edition 2024 makes every `unsafe fn` body require an
# explicit unsafe block, which adds noise to the large raw-FFI layer without buying
# safety there. See docs/architecture.md, "FFI safety rules".

[dependencies]
# Windows API signatures. Raw FFI only - no wrappers, no API churn between releases.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }
sysinfo = "0.39.6"
sha2 = "0.11.0"
# YARA rule engine: pure Rust, BSD-3-Clause. Used to scan the executables we already
# enumerate, so detection is not limited to guessing a product by its file name.
yara-x = "1.20.0"

[build-dependencies]
# Used only by build.rs to turn the vendored LOLRMM database into a Rust const.
# Keeps the shipped binary free of a JSON parser.
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Deterministic, warning-free builds: the lint set is explicit so that
# `cargo clippy` in CI means exactly what it means locally.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
